          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/RuleViolation'
      security:
      - bearerAuth: []
      - sessionAuth: []
      parameters:
      - name: storeId
