openapi: 3.1.0
info:
  title: Smart WiFi Pass API
  version: 1.0.0
  description: Django REST API 전체 계약. 외부 SMS, OpenAI, Network Adapter는 Provider 인터페이스와 Demo/규칙 기반 폴백으로
    동작한다.
servers:
- url: http://localhost:8000/api/v1
  description: Local
paths:
  /pos/orders:
    post:
      tags:
      - POS
      summary: 결제 완료 주문 생성
      operationId: postPosOrders
      responses:
        '200': &id001
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/RuleViolation'
        '201': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaidOrderRequest'
      security:
      - posSignature: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      - name: X-Timestamp
        in: header
        required: false
        schema:
          type: string
          format: date-time
        description: POS_HMAC_SECRET 설정 시 필수
      - name: X-Nonce
        in: header
        required: false
        schema:
          type: string
  /pos/rewards/immediate/{redemptionId}/apply:
