          application/json:
            schema:
              $ref: '#/components/schemas/PrivacyRetentionRequest'
      security:
      - bearerAuth: []
      - sessionAuth: []
  /admin/privacy/export:
    get:
      tags:
      - Admin Privacy
      summary: 점주 보호 증빙 내보내기
      operationId: getAdminPrivacyExport
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/RuleViolation'
      security:
      - bearerAuth: []
      - sessionAuth: []
      parameters:
      - name: storeId
        in: query
        required: true
        schema: *id012
  /admin/settings:
    get:
      tags:
      - Admin Settings
