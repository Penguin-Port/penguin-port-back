components:
  securitySchemes:
    portalSession:
      type: apiKey
      in: header
      name: X-Portal-Session
    sessionAuth:
      type: apiKey
      in: cookie
      name: sessionid
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: smartpass_refresh
    posSignature:
      type: apiKey
      in: header
      name: X-Signature
  schemas:
    SuccessEnvelope:
      type: object
      properties:
        data: {}
        meta:
          type: object
          properties:
            requestId:
              type: string
            serverTime: &id027
              type: string
              format: date-time
          required:
          - requestId
          - serverTime
      required:
      - data
      - meta
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        retryable:
          type: boolean
        requestId:
          type: string
      required:
      - type
      - title
      - status
      - code
      - detail
      - retryable
      - requestId
    PaidOrderRequest:
      type: object
      properties:
        storeId: *id012
        externalOrderId:
          type: string
        customer:
          type: object
          properties:
            memberId:
              type:
              - string
              - 'null'
            phone:
              type:
              - string
              - 'null'
              example: 01012345678
        items:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              productId: *id012
              quantity:
                type: integer
                minimum: 1
              unitPrice:
                type: integer
                minimum: 0
            required:
            - productId
            - quantity
        totalAmount:
          type: integer
          minimum: 0
        paidAt: *id027
      required:
      - storeId
      - externalOrderId
      - customer
      - items
      - totalAmount
      - paidAt
    OrderClaimExchangeRequest:
      type: object
      properties:
        orderClaim:
          type: string
      required:
      - orderClaim
    ImmediateBenefitApplyRequest:
      type: object
      properties:
        storeId: *id012
        orderId: *id012
      required:
      - storeId
      - orderId
    VerificationStartRequest:
      type: object
      properties:
        verificationTicket:
          type: string
        phone:
          type: string
      required:
      - verificationTicket
      - phone
    VerificationConfirmRequest:
      type: object
      properties:
        challengeId: *id012
        code:
          type: string
          pattern: ^\d{6}$
      required:
      - challengeId
      - code
    RewardChooseRequest:
      type: object
      properties:
        benefitId: *id012
        fulfillMode:
          enum:
          - IMMEDIATE
          - COUPON_7D
      required:
      - benefitId
      - fulfillMode
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
      - username
      - password
    StoreRequest:
      type: object
      properties:
        storeId: *id012
      required:
      - storeId
    RefundRequest:
      type: object
      properties:
        storeId: *id012
        refundAmount:
          type: integer
          minimum: 1
      required:
      - storeId
      - refundAmount
    ProductCreateRequest:
      type: object
      properties:
        storeId: *id012
        categoryId: *id012
        name:
          type: string
        price:
          type: integer
          minimum: 0
      required:
      - storeId
      - categoryId
      - name
      - price
    WiFiPolicyRequest:
      type: object
      properties:
        storeId: *id012
        baseMinutes:
          type: integer
          minimum: 1
        quietHoursEnabled:
          type: boolean
        quietHoursUntil:
          type:
          - string
          - 'null'
          format: time
        amountTiers:
          type: array
          items:
            type: object
            properties:
              orderType:
                enum:
                - FIRST
                - ADDITIONAL
              minAmount:
                type: integer
                minimum: 0
              bonusMinutes:
                type: integer
                minimum: 0
            required:
            - orderType
            - minAmount
            - bonusMinutes
      required:
      - storeId
      - baseMinutes
      - amountTiers
    WiFiSimulateRequest:
      type: object
      properties:
        storeId: *id012
        orderType:
          enum:
          - FIRST
          - ADDITIONAL
        amount:
          type: integer
          minimum: 0
      required:
      - storeId
      - orderType
      - amount
    ManualPassActionRequest:
      type: object
      properties:
        storeId: *id012
        action:
          enum:
          - EXTEND
          - BLOCK
          - UNBLOCK
        minutes:
          type: integer
          minimum: 1
      required:
      - storeId
      - action
    RewardTierRequest:
      type: object
      properties:
        storeId: *id012
        name:
          type: string
        thresholdAmount:
          type: integer
          minimum: 1
        sortOrder:
          type: integer
          minimum: 0
        benefits:
          type: array
          items:
            type: object
            properties:
              benefitType:
                type: string
              title:
                type: string
              payload:
                type: object
            required:
            - benefitType
            - title
      required:
      - storeId
      - name
      - thresholdAmount
      - sortOrder
      - benefits
    InventoryCreateRequest:
      type: object
      properties:
        storeId: *id012
        productId: *id012
        quantity:
          type: number
        unit:
          type: string
        lowStockThreshold:
          type: number
        expiresOn:
          type:
          - string
          - 'null'
          format: date
      required:
      - storeId
      - productId
      - quantity
    InventoryAdjustRequest:
      type: object
      properties:
        quantityDelta:
          type: number
        reason:
          type: string
      required:
      - quantityDelta
      - reason
    RecommendationGenerateRequest:
      type: object
      properties:
        storeId: *id012
        type:
          enum:
          - SALES_SUMMARY
          - TIME_SALE
          - INVENTORY_PROMOTION
          - MENU_TREND
      required:
      - storeId
      - type
    RecommendationEditRequest:
      type: object
      properties:
        storeId: *id012
        version:
          type: integer
          minimum: 1
        payload:
          type: object
        reason:
          type: string
      required:
      - storeId
      - version
      - payload
    RecommendationAcceptRequest:
      type: object
      properties:
        storeId: *id012
        version:
          type: integer
          minimum: 1
        title:
          type: string
        payload:
          type: object
        startsAt: *id027
        endsAt: *id027
      required:
      - storeId
      - version
      - title
      - payload
      - startsAt
      - endsAt
    RecommendationRejectRequest:
      type: object
      properties:
        storeId: *id012
        reason:
          type: string
      required:
      - storeId
    PromotionUpdateRequest:
      type: object
      properties:
        storeId: *id012
        title:
          type: string
        payload:
          type: object
        startsAt: *id027
        endsAt: *id027
        status:
          enum:
          - DRAFT
          - SCHEDULED
          - ACTIVE
          - ENDED
      required:
      - storeId
    MembershipRequest:
      type: object
      properties:
        storeId: *id012
        userId:
          type: integer
        role:
          enum:
          - OWNER
          - MANAGER
          - STAFF
          - VIEWER
      required:
      - storeId
      - userId
      - role
    PrivacyRetentionRequest:
      type: object
      properties:
        storeId: *id012
        phoneRetentionDays:
          type: integer
          minimum: 1
        verificationRetentionDays:
          type: integer
          minimum: 1
        auditRetentionDays:
          type: integer
          minimum: 1
        noticeText:
          type: string
      required:
      - storeId
    StoreSettingsRequest:
      type: object
      properties:
        storeId: *id012
        name:
          type: string
        timezone:
          type: string
        businessDayCutoff:
          type: string
          format: time
        segment:
          enum:
          - UNIVERSITY
          - FRANCHISE
        otpSkipEnabled:
          type: boolean
      required:
      - storeId
  responses:
    BadRequest:
      description: 요청 형식 오류
      content: &id028
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: 인증 실패
      content: *id028
    Forbidden:
      description: 권한 부족
      content: *id028
    NotFound:
      description: 리소스 없음
      content: *id028
    Conflict:
      description: 상태 또는 버전 충돌
      content: *id028
    RuleViolation:
      description: 도메인 규칙 위반
      content: *id028
