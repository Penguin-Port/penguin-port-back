openapi: 3.1.0
info:
  title: Smart WiFi Pass MVP
  description: PDF 축소 명세의 FastAPI 단일 백엔드입니다.
  version: 1.0.0
paths:
  /pos/orders:
    post:
      tags:
      - POS
      summary: Create Order
      operationId: create_order_pos_orders_post
      parameters:
      - name: x-demo-key
        in: header
        required: true
        schema:
          type: string
          title: X-Demo-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PosOrderRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /public/order-claims/exchange:
    post:
      tags:
      - Public
      summary: Exchange Claim
      operationId: exchange_claim_public_order_claims_exchange_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimExchangeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /public/otp/send:
    post:
      tags:
      - Public
      summary: Send Otp
      operationId: send_otp_public_otp_send_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpSendRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /public/otp/confirm:
    post:
      tags:
      - Public
      summary: Confirm Otp
      operationId: confirm_otp_public_otp_confirm_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpConfirmRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /public/passes/{pass_id}/activate:
    post:
      tags:
      - Public
      summary: Activate Pass
      operationId: activate_pass_public_passes__pass_id__activate_post
      parameters:
      - name: pass_id
        in: path
        required: true
        schema:
          type: string
          title: Pass Id
      - name: x-portal-session
        in: header
        required: true
        schema:
          type: string
          title: X-Portal-Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /public/passes/{pass_id}:
    get:
      tags:
      - Public
      summary: Get Pass
      operationId: get_pass_public_passes__pass_id__get
      parameters:
      - name: pass_id
        in: path
        required: true
        schema:
          type: string
          title: Pass Id
      - name: x-portal-session
        in: header
        required: true
        schema:
          type: string
          title: X-Portal-Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /public/upsell-hint:
    get:
      tags:
      - Public
      summary: Upsell Hint
      operationId: upsell_hint_public_upsell_hint_get
      parameters:
      - name: x-portal-session
        in: header
        required: true
        schema:
          type: string
          title: X-Portal-Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /public/rewards/grants/{grant_id}/options:
    get:
      tags:
      - Public
      summary: Reward Options
      operationId: reward_options_public_rewards_grants__grant_id__options_get
      parameters:
      - name: grant_id
        in: path
        required: true
        schema:
          type: string
          title: Grant Id
      - name: x-portal-session
        in: header
        required: true
        schema:
          type: string
          title: X-Portal-Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /public/rewards/{grant_id}/choose:
    post:
      tags:
      - Public
      summary: Choose Reward
      operationId: choose_reward_public_rewards__grant_id__choose_post
      parameters:
      - name: grant_id
        in: path
        required: true
        schema:
          type: string
          title: Grant Id
      - name: x-portal-session
        in: header
        required: true
        schema:
          type: string
          title: X-Portal-Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RewardChooseRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/login:
    post:
      tags:
      - Admin
      summary: Login
      operationId: login_admin_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/passes/active:
    get:
      tags:
      - Admin
      summary: Active Passes
      operationId: active_passes_admin_passes_active_get
      parameters:
      - name: storeId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Storeid
      - name: authorization
        in: header
        required: true
        schema:
          type: string
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/passes/{pass_id}/extend:
    post:
      tags:
      - Admin
      summary: Extend Pass
      operationId: extend_pass_admin_passes__pass_id__extend_post
      parameters:
      - name: pass_id
        in: path
        required: true
        schema:
          type: string
          title: Pass Id
      - name: authorization
        in: header
        required: true
        schema:
          type: string
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPassExtendRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/passes/{pass_id}/expire:
    post:
      tags:
      - Admin
      summary: Expire Pass
      operationId: expire_pass_admin_passes__pass_id__expire_post
      parameters:
      - name: pass_id
        in: path
        required: true
        schema:
          type: string
          title: Pass Id
      - name: authorization
        in: header
        required: true
        schema:
          type: string
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/AdminPassExpireRequest'
              - type: 'null'
              title: Payload
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/ai/recommendations:
    get:
      tags:
      - Admin
      summary: Recommendations
      operationId: recommendations_admin_ai_recommendations_get
      parameters:
      - name: authorization
        in: header
        required: true
        schema:
          type: string
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/ai/recommendations/{recommendation_id}/accept:
    post:
      tags:
      - Admin
      summary: Accept Recommendation
      operationId: accept_recommendation_admin_ai_recommendations__recommendation_id__accept_post
      parameters:
      - name: recommendation_id
        in: path
        required: true
        schema:
          type: string
          title: Recommendation Id
      - name: authorization
        in: header
        required: true
        schema:
          type: string
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationDecisionRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/ai/recommendations/{recommendation_id}/reject:
    post:
      tags:
      - Admin
      summary: Reject Recommendation
      operationId: reject_recommendation_admin_ai_recommendations__recommendation_id__reject_post
      parameters:
      - name: recommendation_id
        in: path
        required: true
        schema:
          type: string
          title: Recommendation Id
      - name: authorization
        in: header
        required: true
        schema:
          type: string
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/RecommendationRejectRequest'
              - type: 'null'
              title: Payload
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AdminLoginRequest:
      properties:
        username:
          type: string
          title: Username
        password:
          type: string
          title: Password
      type: object
      required:
      - username
      - password
      title: AdminLoginRequest
    AdminPassExpireRequest:
      properties:
        storeId:
          anyOf:
          - type: string
          - type: 'null'
          title: Storeid
      type: object
      title: AdminPassExpireRequest
    AdminPassExtendRequest:
      properties:
        storeId:
          anyOf:
          - type: string
          - type: 'null'
          title: Storeid
        minutes:
          type: integer
          minimum: 1.0
          title: Minutes
      type: object
      required:
      - minutes
      title: AdminPassExtendRequest
    ClaimExchangeRequest:
      properties:
        orderClaim:
          type: string
          title: Orderclaim
      type: object
      required:
      - orderClaim
      title: ClaimExchangeRequest
    CustomerRequest:
      properties:
        memberId:
          anyOf:
          - type: string
          - type: 'null'
          title: Memberid
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
      type: object
      title: CustomerRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    OrderItemRequest:
      properties:
        productId:
          type: string
          title: Productid
        quantity:
          type: integer
          minimum: 1.0
          title: Quantity
        unitPrice:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Unitprice
      type: object
      required:
      - productId
      - quantity
      title: OrderItemRequest
    OtpConfirmRequest:
      properties:
        challengeId:
          type: string
          title: Challengeid
        code:
          type: string
          pattern: ^\d{6}$
          title: Code
      type: object
      required:
      - challengeId
      - code
      title: OtpConfirmRequest
    OtpSendRequest:
      properties:
        verificationTicket:
          type: string
          title: Verificationticket
        phone:
          type: string
          title: Phone
      type: object
      required:
      - verificationTicket
      - phone
      title: OtpSendRequest
    PosOrderRequest:
      properties:
        storeId:
          type: string
          title: Storeid
        externalOrderId:
          type: string
          title: Externalorderid
        customer:
          $ref: '#/components/schemas/CustomerRequest'
        items:
          items:
            $ref: '#/components/schemas/OrderItemRequest'
          type: array
          minItems: 1
          title: Items
        totalAmount:
          type: integer
          minimum: 0.0
          title: Totalamount
        paidAt:
          type: string
          format: date-time
          title: Paidat
      type: object
      required:
      - storeId
      - externalOrderId
      - customer
      - items
      - totalAmount
      - paidAt
      title: PosOrderRequest
    RecommendationDecisionRequest:
      properties:
        storeId:
          type: string
          title: Storeid
        version:
          type: integer
          minimum: 1.0
          title: Version
      type: object
      required:
      - storeId
      - version
      title: RecommendationDecisionRequest
    RecommendationRejectRequest:
      properties:
        storeId:
          anyOf:
          - type: string
          - type: 'null'
          title: Storeid
        reason:
          type: string
          title: Reason
          default: ''
      type: object
      title: RecommendationRejectRequest
    RewardChooseRequest:
      properties:
        benefitId:
          type: string
          title: Benefitid
        fulfillMode:
          type: string
          pattern: ^(IMMEDIATE|COUPON_7D)$
          title: Fulfillmode
      type: object
      required:
      - benefitId
      - fulfillMode
      title: RewardChooseRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
