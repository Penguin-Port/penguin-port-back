components:
  schemas:
    AdminLoginRequest:
      properties:
        username:
          type: string
          title: Username
        password:
          type: string
          title: Password
      type: object
      required:
      - username
      - password
      title: AdminLoginRequest
    AdminLogoutRequest:
      properties:
        refreshToken:
          anyOf:
          - type: string
          - type: 'null'
          title: Refreshtoken
      type: object
      title: AdminLogoutRequest
    AdminPassExpireRequest:
      properties:
        storeId:
          anyOf:
          - type: string
          - type: 'null'
          title: Storeid
      type: object
      title: AdminPassExpireRequest
    AdminPassExtendRequest:
      properties:
        storeId:
          anyOf:
          - type: string
          - type: 'null'
          title: Storeid
        minutes:
          type: integer
          minimum: 1.0
          title: Minutes
      type: object
      required:
      - minutes
      title: AdminPassExtendRequest
    AdminRefreshRequest:
      properties:
        refreshToken:
          anyOf:
          - type: string
          - type: 'null'
          title: Refreshtoken
      type: object
      title: AdminRefreshRequest
    ClaimExchangeRequest:
      properties:
        orderClaim:
          type: string
          title: Orderclaim
      type: object
      required:
      - orderClaim
      title: ClaimExchangeRequest
    CustomerRequest:
      properties:
        memberId:
          anyOf:
          - type: string
          - type: 'null'
          title: Memberid
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
      type: object
      title: CustomerRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    InventoryAdjustRequest:
      properties:
        storeId:
          type: string
          title: Storeid
        quantityDelta:
          type: integer
          title: Quantitydelta
        reason:
          type: string
          title: Reason
          default: ''
      type: object
      required:
      - storeId
      - quantityDelta
      title: InventoryAdjustRequest
    InventoryUpsertRequest:
      properties:
        storeId:
          type: string
          title: Storeid
        productId:
          type: string
          title: Productid
        quantity:
          type: integer
          minimum: 0.0
          title: Quantity
        lowStockThreshold:
          type: integer
          minimum: 0.0
          title: Lowstockthreshold
          default: 0
        expiresOn:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Expireson
        unit:
          type: string
          title: Unit
          default: EA
      type: object
      required:
      - storeId
      - productId
      - quantity
      title: InventoryUpsertRequest
    OrderItemRequest:
      properties:
        productId:
          type: string
          title: Productid
        quantity:
          type: integer
          minimum: 1.0
          title: Quantity
        unitPrice:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Unitprice
      type: object
      required:
      - productId
      - quantity
      title: OrderItemRequest
    OtpConfirmRequest:
      properties:
        challengeId:
          type: string
          title: Challengeid
        code:
          type: string
          pattern: ^\d{6}$
          title: Code
      type: object
      required:
      - challengeId
      - code
      title: OtpConfirmRequest
    OtpSendRequest:
      properties:
        verificationTicket:
          type: string
          title: Verificationticket
        phone:
          type: string
          title: Phone
      type: object
      required:
      - verificationTicket
      - phone
      title: OtpSendRequest
    PolicyTierRequest:
      properties:
        minAmount:
          type: integer
          minimum: 0.0
          title: Minamount
        minutes:
          type: integer
          minimum: 0.0
          title: Minutes
      type: object
      required:
      - minAmount
      - minutes
      title: PolicyTierRequest
    PosOrderRequest:
      properties:
        storeId:
          type: string
          title: Storeid
        externalOrderId:
          type: string
          title: Externalorderid
        customer:
          $ref: '#/components/schemas/CustomerRequest'
        items:
          items:
            $ref: '#/components/schemas/OrderItemRequest'
          type: array
          minItems: 1
          title: Items
        totalAmount:
          type: integer
          minimum: 0.0
          title: Totalamount
        paidAt:
          type: string
          format: date-time
          title: Paidat
      type: object
      required:
      - storeId
      - externalOrderId
      - customer
      - items
      - totalAmount
      - paidAt
      title: PosOrderRequest
    PosRefundRequest:
      properties:
        storeId:
          type: string
          title: Storeid
        refundAmount:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Refundamount
        reason:
          type: string
          title: Reason
          default: ''
      type: object
      required:
      - storeId
      title: PosRefundRequest
    RecommendationDecisionRequest:
      properties:
        storeId:
          type: string
          title: Storeid
        version:
          type: integer
          minimum: 1.0
          title: Version
        menuIds:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Menuids
        discountRate:
          anyOf:
          - type: integer
            maximum: 100.0
            minimum: 0.0
          - type: 'null'
          title: Discountrate
        startsAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Startsat
        endsAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Endsat
      type: object
      required:
      - storeId
      - version
      title: RecommendationDecisionRequest
    RecommendationGenerateRequest:
      properties:
        storeId:
          type: string
          title: Storeid
        type:
          type: string
          pattern: ^(TIME_SALE|SALES_SUMMARY|INVENTORY_PROMOTION|MENU_TREND)$
          title: Type
          default: TIME_SALE
        businessDate:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Businessdate
      type: object
      required:
      - storeId
      title: RecommendationGenerateRequest
    RecommendationPatchRequest:
      properties:
        storeId:
          type: string
          title: Storeid
        version:
          type: integer
          minimum: 1.0
          title: Version
        menuIds:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Menuids
        discountRate:
          anyOf:
          - type: integer
            maximum: 100.0
            minimum: 0.0
          - type: 'null'
          title: Discountrate
        startsAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Startsat
        endsAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Endsat
      type: object
      required:
      - storeId
      - version
      title: RecommendationPatchRequest
    RecommendationRejectRequest:
      properties:
        storeId:
          anyOf:
          - type: string
          - type: 'null'
          title: Storeid
        reason:
          type: string
          title: Reason
          default: ''
      type: object
      title: RecommendationRejectRequest
    RewardBenefitUpsertRequest:
      properties:
        benefitId:
          anyOf:
          - type: string
          - type: 'null'
          title: Benefitid
        benefitType:
          type: string
          maxLength: 40
          minLength: 1
          title: Benefittype
        title:
          type: string
          maxLength: 120
          minLength: 1
          title: Title
        payload:
          additionalProperties: true
          type: object
          title: Payload
      type: object
      required:
      - benefitType
      - title
      title: RewardBenefitUpsertRequest
    RewardChooseRequest:
      properties:
        benefitId:
          type: string
          title: Benefitid
        fulfillMode:
          type: string
          pattern: ^(IMMEDIATE|COUPON_7D)$
          title: Fulfillmode
        orderId:
          anyOf:
          - type: string
          - type: 'null'
          title: Orderid
      type: object
      required:
      - benefitId
      - fulfillMode
      title: RewardChooseRequest
    RewardTierUpsertRequest:
      properties:
        storeId:
          type: string
          title: Storeid
        tierId:
          anyOf:
          - type: string
          - type: 'null'
          title: Tierid
        name:
          type: string
          maxLength: 80
          minLength: 1
          title: Name
        thresholdAmount:
          type: integer
          minimum: 0.0
          title: Thresholdamount
        sortOrder:
          type: integer
          minimum: 0.0
          title: Sortorder
        benefits:
          items:
            $ref: '#/components/schemas/RewardBenefitUpsertRequest'
          type: array
          maxItems: 12
          title: Benefits
      type: object
      required:
      - storeId
      - name
      - thresholdAmount
      - sortOrder
      title: RewardTierUpsertRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    WifiPolicyPublishRequest:
      properties:
        version:
          type: integer
          minimum: 1.0
          title: Version
        baseMinutes:
          type: integer
          maximum: 1440.0
          minimum: 1.0
          title: Baseminutes
        firstOrderTiers:
          items:
            $ref: '#/components/schemas/PolicyTierRequest'
          type: array
          maxItems: 8
          title: Firstordertiers
        additionalOrderTiers:
          items:
            $ref: '#/components/schemas/PolicyTierRequest'
          type: array
          maxItems: 8
          title: Additionalordertiers
      type: object
      required:
      - version
      - baseMinutes
      title: WifiPolicyPublishRequest
    WifiPolicySimulationRequest:
      properties:
        orderType:
          type: string
          pattern: ^(FIRST|ADDITIONAL)$
          title: Ordertype
        amount:
          type: integer
          minimum: 0.0
          title: Amount
      type: object
      required:
      - orderType
      - amount
      title: WifiPolicySimulationRequest
