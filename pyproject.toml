[project]
name = "smart-wifi-pass-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "SQLAlchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "PyJWT>=2.8,<3.0",
  "openai>=1.0,<2.0",
  "Django>=5.2,<6.1",
  "djangorestframework>=3.15,<4.0",
  "celery>=5.4,<6.0",
  "redis>=5.0,<7.0",
  "gunicorn>=23.0,<24.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
