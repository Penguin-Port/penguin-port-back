[project]
name = "smart-wifi-pass-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.0,<7.0",
  "djangorestframework>=3.15,<4.0",
  "psycopg[binary]>=3.2,<4.0",
  "celery>=5.4,<6.0",
  "redis>=5.0,<7.0",
  "PyYAML>=6.0,<7.0",
  "argon2-cffi>=23.1,<26.0",
  "cryptography>=42.0,<46.0",
  "PyJWT>=2.8,<3.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
